services:
  clones:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:4210:4210"
    environment:
      CLONES_ADMIN_TOKEN: ${CLONES_ADMIN_TOKEN:?set CLONES_ADMIN_TOKEN}
      CLONES_REGISTRATION_KEY: ${CLONES_REGISTRATION_KEY:?set CLONES_REGISTRATION_KEY}
    volumes:
      - clones-data:/app/data
volumes:
  clones-data: